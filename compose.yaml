services:
  packapp:
    platform: linux/amd64
    build: .
    image: packapp-packager:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:10010:10010"
    environment:
      PACK_AUTH_TOKEN_FILE: /run/secrets/pack_token
    secrets: [pack_token]
    volumes:
      - ./app/packager/etc/packager-etc.yaml:/app/etc/packager.yaml:ro
      - pack-data:/app/data
      - gradle-cache:/app/gradle-cache
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
secrets:
  pack_token:
    file: ./secrets/pack_token
volumes:
  pack-data:
  gradle-cache:
